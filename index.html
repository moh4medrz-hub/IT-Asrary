<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منسق التقنية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #2563eb; text-align: center; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
        }
        button {
            width: 100%; background: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="container">
    <h1>👨‍💻 منسق التقنية بالمجمع</h1>
    <form action="https://formspree.io" method="POST">
        
        <div class="form-group">
            <label>القسم المعني</label>
            <select name="القسم" required>
                <option value="الإدارة">الإدارة</option>
                <option value="القسم الابتدائي">القسم الابتدائي</option>
                <option value="القسم المتوسط">القسم المتوسط</option>
                <option value="القسم الثانوي">القسم الثانوي</option>
            </select>
        </div>

        <div class="form-group">
            <label>الموقع بدقة</label>
            <input type="text" name="المكان" placeholder="مثال: الدور الثاني - فصل 3" required>
        </div>

        <div class="form-group">
            <label>أهمية الطلب</label>
            <select name="الأهمية" required>
                <option value="عادي">🟢 عادي</option>
                <option value="مهم">🟡 مهم</option>
                <option value="عاجل">🔴 عاجل</option>
            </select>
        </div>

        <div class="form-group">
            <label>وصف المشكلة</label>
            <textarea name="الوصف" rows="4" placeholder="اكتب المشكلة هنا..." required></textarea>
        </div>

        <button type="submit">إرسال الطلب للمنسق 🚀</button>
    </form>
</div>

</body>
</html>
