<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام رفع البلاغات التقنية</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-color: #ccc;
            --success-color: #28a745;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .form-container h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* رسالة النجاح */
        .success-message {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>تقديم بلاغ تقني</h2>
    
    <!-- مكان ظهور رسالة النجاح -->
    <div id="successMessage" class="success-message"></div>

    <form id="techReportForm" action="/submit-report" method="POST" enctype="multipart/form-data">
        
        <!-- معلومات المُبلغ -->
        <div class="form-group">
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" name="name" placeholder="أدخل اسمك الثلاثي" required>
        </div>

        <div class="form-group">
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required>
        </div>

        <!-- تفاصيل البلاغ -->
        <div class="form-group">
            <label for="category">نوع المشكلة التقنية:</label>
            <select id="category" name="category" required>
                <option value="" disabled selected>اختر نوع المشكلة...</option>
                <option value="hardware">أعطال الأجهزة (Hardware)</option>
                <option value="software">مشكلة في الأنظمة أو البرامج (Software)</option>
                <option value="network">انقطاع أو بطء الإنترنت والشبكات</option>
                <option value="account">مشاكل الحسابات وكلمات المرور</option>
                <option value="other">أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="priority">درجة الأهمية:</label>
            <select id="priority" name="priority" required>
                <option value="low">منخفضة (لا تعطل العمل اليومي)</option>
                <option value="medium" selected>متوسطة</option>
                <option value="high">عالية (تأثير مباشر على العمل)</option>
                <option value="critical">حرجة (توقف كامل للنظام أو الخدمة)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="subject">عنوان البلاغ:</label>
            <input type="text" id="subject" name="subject" placeholder="مثال: عدم القدرة على تسجيل الدخول للأنظمة" required>
        </div>

        <div class="form-group">
            <label for="description">وصف تفصيلي للمشكلة:</label>
            <textarea id="description" name="description" placeholder="يرجى كتابة خطوات حدوث المشكلة وأي رسائل خطأ تظهر لك..." required></textarea>
        </div>

        <!-- رفع المرفقات -->
        <div class="form-group">
            <label for="attachment">إرفاق صورة للخطأ أو ملف توضيحي (اختياري):</label>
            <input type="file" id="attachment" name="attachment" accept="image/*,.pdf,.doc,.docx">
        </div>

        <!-- زر الإرسال -->
        <button type="submit" class="btn-submit">إرسال البلاغ التقني</button>

    </form>
</div>

<script>
    document.getElementById('techReportForm').addEventListener('submit', function(event) {
        // منع النموذج من إعادة تحميل الصفحة بشكل تلقائي لتجربة الكود فوراً
        event.preventDefault();

        // توليد رقم بلاغ عشوائي للتوضيح
        const reportId = Math.floor(100000 + Math.random() * 900000);

        // إظهار رسالة النجاح
        const successDiv = document.getElementById('successMessage');
        successDiv.innerHTML = `🎉 تم إرسال البلاغ بنجاح! رقم التتبع الخاص بك هو: #${reportId}`;
        successDiv.style.display = 'block';

        // إعادة تعيين الحقول (تنظيف الفورم)
        document.getElementById('techReportForm').reset();

        // التمرير لأعلى الصفحة لرؤية الرسالة
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
</script>

</body>
</html>
